[tox]
minversion = 4.0
envlist = py310, py311, py312, py313, py314, ruff, mypy

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312, ruff, mypy
    3.13: py313
    3.14: py314

[testenv]
deps =
    pytest
commands =
    pytest calculator_package_wdboone --basetemp={envtmpdir}

[testenv:ruff]
basepython = python3.12
skip_install = true
deps =
    ruff==0.17.0
commands =
    ruff check calculator_package_wdboone
    ruff format --check calculator_package_wdboone

[testenv:mypy]
basepython = python3.12
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    mypy calculator_package_wdboone
